<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unix Timestamp Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center py-5">

  <div class="container">
    <h1 class="mb-4">Unix Timestamp to Local Time</h1>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <input type="number" id="timestampInput" class="form-control mb-3" placeholder="Enter Unix timestamp">
        <button onclick="convertTime()" class="btn btn-primary w-100 mb-4">Convert</button>
        <div id="result" class="text-start bg-white p-3 rounded shadow-sm"></div>
      </div>
    </div>

    <footer class="mt-5 text-muted small">
      <p>Made with ❤️ by <strong>SIRTOOLZ</strong></p>
      <p>
        <a href="https://twitter.com/sirtoolz" target="_blank">Twitter</a> |
        <a href="https://t.me/sirtoolzalpha" target="_blank">Telegram Community</a>
      </p>
    </footer>
  </div>

  <script>
    function convertTime() {
      const input = document.getElementById('timestampInput').value;
      const resultDiv = document.getElementById('result');

      if (!input) {
        resultDiv.innerHTML = "<div class='text-danger'>Please enter a timestamp.</div>";
        return;
      }

      const timestamp = parseInt(input);
      const utcDate = new Date(timestamp * 1000).toUTCString();
      const localDate = new Date(timestamp * 1000).toString();

      resultDiv.innerHTML = `
        <p><strong>UTC Time:</strong> ${utcDate}</p>
        <p><strong>Your Local Time:</strong> ${localDate}</p>
      `;
    }
  </script>

  <!-- Bootstrap JS Bundle (optional, only needed if using components like modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
