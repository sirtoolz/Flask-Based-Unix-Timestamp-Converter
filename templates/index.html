<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unix Timestamp Converter</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin-top: 50px;
      background-color: #f8f9fa;
      color: #333;
    }
    input, button { 
      padding: 10px; 
      font-size: 1em; 
      margin: 10px;
    }
    #result { 
      margin-top: 20px; 
      font-size: 1.2em; 
    }
    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Unix Timestamp to Local Time</h1>
  <input type="number" id="timestampInput" placeholder="Enter Unix timestamp">
  <button onclick="convertTime()">Convert</button>

  <div id="result"></div>

  <footer>
  <p>Made with ❤️ by <strong>SIRTOOLZ</strong></p>
  <p>
    <a href="https://twitter.com/sirtoolz" target="_blank">Twitter</a> |
    <a href="https://t.me/sirtoolzalpha" target="_blank">Telegram Community</a>
  </p>
  </footer>

  <script>
    function convertTime() {
      const input = document.getElementById('timestampInput').value;
      const resultDiv = document.getElementById('result');

      if (!input) {
        resultDiv.innerHTML = "<span style='color: red;'>Please enter a timestamp.</span>";
        return;
      }

      const timestamp = parseInt(input);
      const utcDate = new Date(timestamp * 1000).toUTCString();
      const localDate = new Date(timestamp * 1000).toString();

      resultDiv.innerHTML = `
        <p><strong>UTC Time:</strong> ${utcDate}</p>
        <p><strong>Your Local Time:</strong> ${localDate}</p>
      `;
    }
  </script>
</body>
</html>
